services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: student-vkr-postgres
    environment:
      POSTGRES_DB: student_vkr_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: